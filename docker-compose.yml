# MockSocial — Dokploy deployment on a PUBLIC VPS (branch: deploy/vps).
#
# The college-LAN variant (IP+port mode, host port 8089) lives on `ts-faithful`.
# This one assumes the box is on the open internet, so:
#   - the app is reached through Dokploy's Traefik on a domain with HTTPS
#     (add it in Dokploy → Domains: service `app`, container port 3000);
#   - the host port is bound to LOOPBACK only by default. Docker-published
#     ports bypass ufw, so binding 0.0.0.0 would expose plain HTTP to everyone;
#   - the seeded admin password must be supplied, never the `staff` default.
#
# Env to provide via Dokploy (Environment tab) — see DEPLOY.md:
#   POSTGRES_PASSWORD      — DB password (also used in DATABASE_URL below)
#   SESSION_SECRET         — long random string
#   SEED_STAFF_PASSWORD    — password for the seeded `staff` admin account
#   SEED_STUDENT_PASSWORD  — password for the seeded student accounts
# Optional:
#   APP_BIND / APP_PORT    — host bind address / port (default 127.0.0.1:8089)
#   SESSION_COOKIE_SECURE  — default true (HTTPS). false ONLY for plain HTTP.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mocksocial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mocksocial
    volumes:
      - mocksocial-db:/var/lib/postgresql/data
    # No `ports:` — internal-only. Reachable by other services as host `db`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocksocial -d mocksocial"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply SQL migrations from ./drizzle, then seed the demo scenario
  # if (and only if) the database is empty — first deploy seeds, redeploys
  # don't touch existing data. Built from the `builder` stage (keeps
  # drizzle-kit + tsx + schema + drizzle.config.ts).
  migrate:
    build:
      context: .
      target: builder
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed:if-empty"]
    environment:
      DATABASE_URL: postgresql://mocksocial:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/mocksocial
      # Only read on the first (empty-DB) deploy. Changing them later does NOT
      # change existing accounts.
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:?set SEED_STAFF_PASSWORD}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:?set SEED_STUDENT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mocksocial:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/mocksocial
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # HTTPS via Traefik → keep the cookie Secure. Browsers drop Secure cookies
      # on plain HTTP, so set "false" only if you serve without TLS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    volumes:
      # Activity log (teacher/admin log viewer) — persists across redeploys.
      - mocksocial-logs:/app/logs
    ports:
      # Loopback-only by default: public traffic comes in via Traefik, and this
      # stays handy for an SSH tunnel (`ssh -L 8089:127.0.0.1:8089 <vps>`).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8089}:3000"
    networks:
      # Declared explicitly: when a domain is attached Dokploy appends
      # `dokploy-network` to this list. Without `default` here the app would
      # land on Traefik's network only and lose the `db` hostname.
      - default
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mocksocial-db:
  mocksocial-logs:
