# MockSocial — Dokploy deployment (physical Ubuntu/Dokploy box, IP+port mode).
#
# Host port 8084 is mocksocial's allocation in ../port-registry.md. Only that
# host port must be unique; the container-internal 3000 can stay as-is.
# The database publishes NO port — it stays internal-only (registry line 31).
#
# Env to provide via Dokploy (or a local .env for testing):
#   POSTGRES_PASSWORD   — DB password (also used in DATABASE_URL below)
#   SESSION_SECRET      — long random string for cookie signing
#
# On the host firewall after first deploy:  sudo ufw allow 8084/tcp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mocksocial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mocksocial
    volumes:
      - mocksocial-db:/var/lib/postgresql/data
    # No `ports:` — internal-only. Reachable by other services as host `db`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocksocial -d mocksocial"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply SQL migrations from ./drizzle, then exit. Built from the
  # `builder` stage (keeps drizzle-kit + schema + drizzle.config.ts).
  migrate:
    build:
      context: .
      target: builder
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://mocksocial:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/mocksocial
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mocksocial:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/mocksocial
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    ports:
      # host 8084 (unique per registry)  ->  container 3000 (Next standalone)
      - "8084:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  mocksocial-db:
