# Build the deploy images in CI and publish them to GHCR, so the VPS only pulls.
# docker-compose.yml on this branch references these tags (no `build:` there).
#
#   ghcr.io/<owner>/<repo>:vps           — `runner` stage  (the app)
#   ghcr.io/<owner>/<repo>-migrate:vps   — `builder` stage (db:migrate + seed)
#
# Each push also gets an immutable `sha-<short>` tag for rollbacks
# (set IMAGE_TAG=sha-abc1234 in Dokploy).
name: Publish Docker images

on:
  push:
    branches: [deploy/vps]
    paths-ignore:
      - "**.md"
      - "docker-compose*.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated (slow on a cold cache, fine once cached). Drop it from
      # PLATFORMS below if the VPS is x86 and you want faster builds.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: names
        run: |
          repo="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "app=$repo" >> "$GITHUB_OUTPUT"
          echo "migrate=$repo-migrate" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # migrate first: it IS the builder stage, so the app build below reuses
      # its layers from cache and only adds the small runner stage.
      - name: Build + push migrate image (builder stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.names.outputs.migrate }}:vps
            ${{ steps.names.outputs.migrate }}:${{ steps.names.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push app image (runner stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.names.outputs.app }}:vps
            ${{ steps.names.outputs.app }}:${{ steps.names.outputs.sha }}
          cache-from: type=gha

      # Optional: once the images exist, tell Dokploy to redeploy via its API.
      # Skipped unless all three repo secrets are set (see DEPLOY.md). Turn OFF
      # Dokploy's own deploy-on-push — it fires before the images are ready and
      # would just pull the previous ones.
      - name: Trigger Dokploy redeploy
        if: env.DOKPLOY_URL != '' && env.DOKPLOY_API_KEY != '' && env.DOKPLOY_COMPOSE_ID != ''
        run: |
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}"
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}

    env:
      PLATFORMS: linux/amd64,linux/arm64
